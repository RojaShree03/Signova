<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNOVA | Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-slate-900 px-5 py-4 border-b border-slate-800">
        <div class="max-w-6xl mx-auto">
            <a href="index.html" class="text-2xl font-bold"> SIGN<span class="text-indigo-400">OVA</span> </a>
        </div>
    </nav>

    <!-- Register Section -->
    <main class="min-h-[calc(100vh-73px)] flex items-center justify-center px-5 py-10">
        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-7">
                <h1 class="text-3xl font-bold">
                    Create your account
                </h1>
                <p class="text-slate-400 mt-2">
                    Join SIGNOVA and get started today.
                </p>
            </div>

            <!-- Register Form -->
            <div class="glass-card rounded-2xl p-6 md:p-8">
                <form id="registerForm" novalidate>

                    <!-- Name -->
                    <div class="mb-5">
                        <label for="registerName" class="block text-sm text-slate-300 mb-2"> Full Name </label>
                        <input type="text" id="registerName" placeholder="Enter your name" autocomplete="name"
                            class="form-input">
                        <p id="nameError" class="error-message"></p>
                    </div>

                    <!-- Email -->
                    <div class="mb-5">
                        <label for="registerEmail" class="block text-sm text-slate-300 mb-2"> Email Address </label>
                        <input type="email" id="registerEmail" placeholder="you@example.com" autocomplete="email"
                            class="form-input">
                        <p id="emailError" class="error-message"></p>
                    </div>

                    <!-- Password -->
                    <div class="mb-5">
                        <label for="registerPassword" class="block text-sm text-slate-300 mb-2"> Password </label>
                        <div class="relative">
                            <input type="password" id="registerPassword" placeholder="Minimum 6 characters"
                                autocomplete="new-password" class="form-input pr-12">
                            <button type="button" id="registerPasswordToggle" class="password-toggle"> 👁 </button>
                        </div>

                        <!-- Password Strength -->
                        <div class="mt-3 flex justify-between text-sm">
                            <span class="text-slate-500"> Password strength </span>
                            <span id="passwordStrengthText" class="text-green-400"> — </span>
                        </div>

                        <p id="passwordError" class="error-message"></p>
                    </div>

                    <!-- Terms -->
                    <div class="flex gap-3 mb-6"> <input type="checkbox" id="terms" class="mt-1 accent-indigo-600">
                        <label for="terms" class="text-sm text-slate-400">
                            I agree to the <span class="text-indigo-400"> Terms & Conditions </span>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" id="registerButton" disabled class="submit-button w-full">
                        Create Account
                    </button>

                </form>

                <!-- Login -->
                <p class="text-center text-sm text-slate-400 mt-6">
                    Already have an account?
                    <a href="login.html" class="text-indigo-400 hover:text-indigo-300"> Sign in </a>
                </p>

            </div>

            <!-- Security -->
            <p class="text-center text-xs text-slate-600 mt-5">
                🔒 Your information is validated before submission.
            </p>

        </div>

    </main>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toastIcon">✓</span>
        <span id="toastMessage">
            Success
        </span>
    </div>

    <script src="./script.js"></script>

</body>

</html>
